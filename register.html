<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Student Account | Lingua Academy</title>
    <meta name="description" content="Register your free student profile to track course enquiries, book trial demo classes, and access batch materials.">

        <!-- Favicon (Save Icon) -->
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="favicon.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link href="assets/css/style.css" rel="stylesheet">
    <link href="assets/css/animations.css" rel="stylesheet">
</head>
<body class="bg-alt min-vh-100 d-flex flex-column justify-content-between">

    <!-- NAVBAR SIMPLE -->
    <nav class="navbar navbar-main">
        <div class="container-fluid px-3 px-xl-5">
            <a class="navbar-brand navbar-brand-logo" href="index.html">
                <div class="brand-icon-wrap"><i class="bi bi-chat-quote-fill"></i></div>
                <span>Lingua<span class="text-orange">Academy</span></span>
            </a>
            <div class="navbar-actions">
                <button class="btn nav-action-btn theme-toggle-btn" title="Toggle Light/Dark Theme" aria-label="Toggle theme"><i class="bi bi-moon-stars-fill"></i></button>
                <button class="btn nav-action-btn rtl-toggle-btn" title="Toggle RTL Layout" aria-label="Toggle text direction"><i class="bi bi-arrow-left-right"></i> <span>RTL</span></button>
                <a href="index.html" class="btn btn-outline-theme btn-sm"><i class="bi bi-house me-1"></i> Website</a>
            </div>
        </div>
    </nav>

    <!-- REGISTER CARD -->
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card p-4 p-sm-5 bg-surface border-0 rounded-4 shadow-lg">
                    <div class="text-center mb-4">
                        <div class="brand-icon-wrap mx-auto mb-3 fs-3">
                            <i class="bi bi-person-plus-fill"></i>
                        </div>
                        <h3 class="font-heading mb-1">Create Student Account</h3>
                        <p class="small text-muted">Join 15,000+ fluent speakers worldwide</p>
                    </div>

                    <form id="registerForm">
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Full Name</label>
                            <input type="text" id="regName" class="form-control" placeholder="e.g. Sarah Jenkins" required>
                        </div>

                        <div class="row g-2 mb-3">
                            <div class="col-md-6">
                                <label class="form-label small fw-bold">Email Address</label>
                                <input type="email" id="regEmail" class="form-control" placeholder="name@domain.com" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-bold">Phone Number</label>
                                <input type="tel" class="form-control" placeholder="+1 (555) 000-0000" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-bold">Primary Course of Interest</label>
                            <select id="regProgram" class="form-select" required>
                                <option value="Spoken English Mastery">Spoken English Mastery</option>
                                <option value="French Language (DELF)">French Language (DELF)</option>
                                <option value="German Language (Goethe)">German Language (Goethe)</option>
                                <option value="IELTS Exam Masterclass">IELTS Exam Masterclass</option>
                                <option value="Public Speaking & Presentation">Public Speaking & Presentation</option>
                                <option value="Kids Communication Skills">Kids' Communication Skills</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-bold">Password</label>
                            <div class="input-group">
                                <input type="password" class="form-control" placeholder="At least 8 characters" required>
                                <button type="button" class="btn btn-outline-secondary toggle-password-btn"><i class="bi bi-eye-fill"></i></button>
                            </div>
                        </div>

                        <div class="form-check mb-4">
                            <input type="checkbox" class="form-check-input" id="regTerms" required checked>
                            <label class="form-check-label small" for="regTerms">I agree to Lingua Academy <a href="#" class="text-orange">Terms of Service</a> & <a href="#" class="text-orange">Privacy Policy</a></label>
                        </div>

                        <button type="submit" class="btn btn-primary-theme btn-lg w-100 mb-3">
                            <i class="bi bi-check-circle-fill me-2"></i> Register Account
                        </button>

                        <div class="text-center small text-muted">
                            Already have an account? <a href="login.html" class="fw-bold text-orange">Log In Here</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- FOOTER SIMPLE -->
    <footer class="py-4 text-center small text-muted bg-surface border-top">
        <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center gap-2">
            <span>&copy; 2026 Lingua Academy. Secure Student Registration.</span>
            <div class="d-flex gap-3">
                <a href="index.html" class="text-muted text-decoration-none">Home</a>
                <a href="courses.html" class="text-muted text-decoration-none">Courses</a>
                <a href="contact.html" class="text-muted text-decoration-none">Support Desk</a>
                <a href="about.html" class="text-muted text-decoration-none">Privacy Policy</a>
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/auth.js"></script>
</body>
</html>
